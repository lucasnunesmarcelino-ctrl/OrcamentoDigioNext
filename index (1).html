<!doctype html>
<html lang="pt-BR" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orçamento de obras</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9ebec;--surf:#fff;--ink:#14283d;--mut:#5d6b78;--line:#cfd5da;--acc:#f2b705;--field:#f6f7f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171f;--surf:#192330;--ink:#e8edf2;--mut:#93a1ae;--line:#2c3a49;--field:#101922}}
:root[data-theme="dark"]{--bg:#10171f;--surf:#192330;--ink:#e8edf2;--mut:#93a1ae;--line:#2c3a49;--field:#101922}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 80px}
h1,h2,h3{font-family:"Barlow Condensed",Impact,sans-serif;margin:0;letter-spacing:.01em}
h1{font-size:30px;line-height:1.05}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:14px}
.top p{margin:4px 0 0;color:var(--mut);font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
.tabs button{flex:1;padding:11px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:600 16px Barlow,sans-serif;border-radius:6px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--mut);font-weight:500}
input,select,textarea{width:100%;margin-top:3px;padding:10px;font:16px Barlow,sans-serif;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px}
textarea{resize:vertical}
.sec{border-left:6px solid var(--acc)}
.sechead{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.sechead input{font:700 22px "Barlow Condensed",sans-serif;margin:0}
.x{flex:none;width:40px;height:40px;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:6px;font-size:20px}
.it{border-top:1px dashed var(--line);padding:12px 0}
.r1{display:flex;gap:8px;margin-bottom:6px}.r1 input{margin:0;font-weight:600}
.r3{display:grid;grid-template-columns:80px 1fr 1fr;gap:8px;margin-top:8px;align-items:end}
.r3 output{grid-column:1/-1;text-align:right;font:700 20px "Barlow Condensed",sans-serif}
.btn{padding:11px 16px;border-radius:6px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-weight:600;font-size:15px}
.btn.p{background:var(--acc);border-color:var(--acc);color:#14283d}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sub{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font:700 20px "Barlow Condensed",sans-serif}
.tot{display:flex;justify-content:space-between;font:700 28px "Barlow Condensed",sans-serif;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:6px;margin-top:10px}
#prev{display:none}
.doc{background:#fff;color:#14283d;border-radius:8px;padding:22px;border:1px solid var(--line)}
.doc h1{font-size:34px;border-bottom:6px solid #f2b705;padding-bottom:6px;margin-bottom:12px}
.doc .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:14px;margin-bottom:14px}
@media(max-width:560px){.doc .meta{grid-template-columns:1fr}}
.doc h3{font-size:22px;margin:18px 0 4px;background:#e9ebec;padding:4px 8px}
.doc .li{padding:8px 0;border-bottom:1px solid #dde1e4}
.doc .li .a{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.doc .li .b{font-size:14px;color:#4b5a68;white-space:pre-wrap;margin:2px 0}
.doc .li .c{font-size:13px;color:#4b5a68}
.doc .st{text-align:right;font-weight:600;margin-top:6px}
.doc .gt{display:flex;justify-content:space-between;font:700 30px "Barlow Condensed",sans-serif;background:#14283d;color:#fff;padding:12px 14px;margin-top:18px}
.doc .nt{font-size:14px;margin-top:14px;white-space:pre-wrap}
.bar{margin-bottom:14px}
@media print{
 body{background:#fff}.noprint{display:none!important}#prev{display:block!important}.wrap{padding:0;max-width:none}.doc{border:0;padding:0}
 .doc h1,.doc h3,.doc .gt{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
 <div class="top noprint"><div><h1>Orçamento de obras</h1><p>Monte por etapas, detalhe cada item e envie ao cliente.</p></div></div>
 <div class="tabs noprint" role="tablist">
  <button role="tab" id="t1" aria-selected="true">Editar</button>
  <button role="tab" id="t2" aria-selected="false">Orçamento do cliente</button>
 </div>

 <div id="edit" class="noprint">
  <div class="card"><h2>Dados</h2>
   <div class="grid" style="margin-top:8px">
    <label>Seu nome ou empresa<input data-m="emp"></label>
    <label>Seu telefone<input data-m="tel" inputmode="tel"></label>
    <label>Nome do cliente<input data-m="cli"></label>
    <label>Endereço da obra<input data-m="end"></label>
    <label>Data<input type="date" data-m="data"></label>
    <label>Validade (dias)<input type="number" inputmode="numeric" data-m="val"></label>
    <label style="grid-column:1/-1">Prazo de execução<input data-m="prazo" placeholder="Ex.: 15 dias úteis após o início"></label>
   </div>
  </div>
  <div id="secs"></div>
  <div class="row" style="margin-bottom:14px">
   <button class="btn p" id="addSec">+ Adicionar etapa</button>
   <button class="btn" id="addExt">+ Despesas extras</button>
   <button class="btn" id="modelo">Carregar modelo de reforma</button>
  </div>
  <div class="card"><h2>Fechamento</h2>
   <div class="grid" style="margin-top:8px">
    <label>Desconto (R$)<input type="number" inputmode="decimal" min="0" step="any" data-g="dsc"></label>
    <label>Forma de pagamento<input data-g="pag"></label>
    <label style="grid-column:1/-1">Observações<textarea rows="3" data-g="obs" placeholder="Ex.: material por conta do contratante, não inclui retirada de entulho…"></textarea></label>
   </div>
   <div class="tot"><span>Total</span><span id="tot">R$ 0,00</span></div>
  </div>
  <div class="row"><button class="btn p" id="go">Ver orçamento do cliente</button><button class="btn" id="clr">Começar novo</button></div>
 </div>

 <div id="prev">
  <div class="bar row noprint">
   <button class="btn p" id="wa">Enviar por WhatsApp</button>
   <button class="btn" id="cp">Copiar texto</button>
   <button class="btn" id="pr">Imprimir ou salvar PDF</button>
  </div>
  <div class="doc" id="doc"></div>
  <p class="noprint" id="msg" style="color:var(--mut);font-size:14px"></p>
 </div>
</div>

<script>
const $=s=>document.querySelector(s), KEY='orcamento-obras-v1';
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const UN=['m²','m','un','vb','dia','mês','h'];
const it=(d,det,u)=>({d,det,u,q:0,v:0});
const extras=()=>({n:'Despesas extras',items:[it('Aluguel de andaime','Montagem, uso e retirada.','dia'),it('Aluguel de compressor','Equipamento para pintura e aplicação.','dia'),it('Outras ferramentas e despesas extras','','vb')]});
const modelo=()=>[
 {n:'Pintura',items:[it('Pintura de paredes internas','Lixar, aplicar selador e duas demãos de tinta acrílica.','m²'),it('Pintura de teto','Preparo da superfície e duas demãos.','m²'),it('Pintura de grades e portões','Lixar, aplicar fundo anticorrosivo e duas demãos de esmalte.','m²')]},
 {n:'Massas e reparos',items:[it('Massa corrida','Aplicação e lixamento para acabamento liso.','m²'),it('Reparo de cantos','Recomposição e acabamento dos cantos danificados.','m'),it('Reparo de trincas e furos','Abertura, preenchimento e lixamento.','un')]},
 {n:'Outros serviços',items:[it('Proteção e limpeza final','Proteção de pisos e móveis e limpeza ao término.','vb')]},
 extras()
];
const blank=()=>({m:{emp:'',tel:'',cli:'',end:'',data:new Date().toISOString().slice(0,10),val:'15',prazo:''},secs:modelo(),dsc:0,pag:'50% na aprovação e 50% na entrega da obra.',obs:''});
let S; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){} if(!S||!S.secs)S=blank();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const secTot=s=>s.items.reduce((a,i)=>a+(i.q||0)*(i.v||0),0);
const sub=()=>S.secs.reduce((a,s)=>a+secTot(s),0);
const total=()=>Math.max(0,sub()-(S.dsc||0));

function render(){
 $('#secs').innerHTML=S.secs.map((s,a)=>`<div class="card sec">
  <div class="sechead"><input data-sn="${a}" value="${esc(s.n)}" aria-label="Nome da etapa"><button class="x" data-ds="${a}" aria-label="Remover etapa">×</button></div>
  ${s.items.map((i,b)=>`<div class="it">
   <div class="r1"><input data-s="${a}" data-i="${b}" data-f="d" value="${esc(i.d)}" placeholder="Serviço (ex.: Pintura de paredes)" aria-label="Serviço"><button class="x" data-di="${a}.${b}" aria-label="Remover item">×</button></div>
   <textarea rows="2" data-s="${a}" data-i="${b}" data-f="det" placeholder="Detalhes: o que está incluso, material, demãos…" aria-label="Detalhes">${esc(i.det)}</textarea>
   <div class="r3">
    <label>Unid.<select data-s="${a}" data-i="${b}" data-f="u">${UN.map(u=>`<option${u===i.u?' selected':''}>${u}</option>`).join('')}</select></label>
    <label>Quantidade<input type="number" inputmode="decimal" min="0" step="any" data-s="${a}" data-i="${b}" data-f="q" value="${i.q||''}"></label>
    <label>Valor unitário (R$)<input type="number" inputmode="decimal" min="0" step="any" data-s="${a}" data-i="${b}" data-f="v" value="${i.v||''}"></label>
    <output id="it-${a}-${b}">${brl((i.q||0)*(i.v||0))}</output>
   </div></div>`).join('')}
  <div class="row" style="margin-top:6px"><button class="btn" data-ai="${a}">+ Adicionar item</button></div>
  <div class="sub"><span>Subtotal da etapa</span><span id="st-${a}">${brl(secTot(s))}</span></div>
 </div>`).join('');
 for(const k in S.m){const e=document.querySelector(`[data-m="${k}"]`);if(e)e.value=S.m[k]}
 for(const k of ['dsc','pag','obs']){const e=document.querySelector(`[data-g="${k}"]`);if(e)e.value=S[k]||''}
 totals();
}
function totals(){
 S.secs.forEach((s,a)=>{const e=$('#st-'+a);if(e)e.textContent=brl(secTot(s));s.items.forEach((i,b)=>{const o=$(`#it-${a}-${b}`);if(o)o.textContent=brl((i.q||0)*(i.v||0))})});
 $('#tot').textContent=brl(total());
}
document.addEventListener('input',e=>{
 const t=e.target,d=t.dataset;
 if(d.m!==undefined)S.m[d.m]=t.value;
 else if(d.g!==undefined)S[d.g]=d.g==='dsc'?parseFloat(t.value)||0:t.value;
 else if(d.sn!==undefined)S.secs[d.sn].n=t.value;
 else if(d.f){const o=S.secs[d.s].items[d.i];o[d.f]=(d.f==='q'||d.f==='v')?(parseFloat(t.value)||0):t.value}
 else return;
 save();totals();
});
document.addEventListener('click',e=>{
 const d=e.target.dataset||{};
 if(d.ds!==undefined){S.secs.splice(d.ds,1)}
 else if(d.di){const[a,b]=d.di.split('.');S.secs[a].items.splice(b,1)}
 else if(d.ai!==undefined){S.secs[d.ai].items.push(it('','','m²'))}
 else return;
 save();render();
});
$('#addSec').onclick=()=>{S.secs.push({n:'Nova etapa',items:[it('','','m²')]});save();render()};
$('#addExt').onclick=()=>{S.secs.push(extras());save();render()};
$('#modelo').onclick=()=>{S.secs=S.secs.concat(modelo());save();render()};
let armed=false;
$('#clr').onclick=function(){
 if(!armed){armed=true;this.textContent='Toque de novo para apagar tudo';setTimeout(()=>{armed=false;this.textContent='Começar novo'},4000);return}
 S=blank();save();render();armed=false;this.textContent='Começar novo';scrollTo(0,0);
};

function fdate(s){if(!s)return'';const p=s.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s}
function show(w){
 $('#edit').style.display=w==='e'?'block':'none';$('#prev').style.display=w==='p'?'block':'none';
 $('#t1').setAttribute('aria-selected',w==='e');$('#t2').setAttribute('aria-selected',w==='p');
 if(w==='p')preview();scrollTo(0,0);
}
$('#t1').onclick=()=>show('e');$('#t2').onclick=()=>show('p');$('#go').onclick=()=>show('p');
function preview(){
 const m=S.m,secs=S.secs.filter(s=>s.items.some(i=>i.d));
 $('#doc').innerHTML=`<h1>Orçamento${m.emp?' · '+esc(m.emp):''}</h1>
 <div class="meta"><div><b>Cliente:</b> ${esc(m.cli)||'—'}</div><div><b>Data:</b> ${fdate(m.data)}</div><div><b>Obra:</b> ${esc(m.end)||'—'}</div><div><b>Validade:</b> ${esc(m.val)||'15'} dias</div>${m.prazo?`<div><b>Prazo:</b> ${esc(m.prazo)}</div>`:''}${m.tel?`<div><b>Contato:</b> ${esc(m.tel)}</div>`:''}</div>
 ${secs.map(s=>`<h3>${esc(s.n)}</h3>${s.items.filter(i=>i.d).map(i=>`<div class="li"><div class="a"><span>${esc(i.d)}</span><span>${brl((i.q||0)*(i.v||0))}</span></div>${i.det?`<div class="b">${esc(i.det)}</div>`:''}<div class="c">${i.q||0} ${esc(i.u)} × ${brl(i.v)}</div></div>`).join('')}<div class="st">Subtotal: ${brl(secTot(s))}</div>`).join('')}
 ${S.dsc?`<div class="st" style="margin-top:14px">Subtotal geral: ${brl(sub())}<br>Desconto: − ${brl(S.dsc)}</div>`:''}
 <div class="gt"><span>Total</span><span>${brl(total())}</span></div>
 ${S.pag?`<div class="nt"><b>Pagamento:</b> ${esc(S.pag)}</div>`:''}${S.obs?`<div class="nt"><b>Observações:</b>\n${esc(S.obs)}</div>`:''}`;
}
function texto(){
 const m=S.m,L=[`*ORÇAMENTO${m.emp?' - '+m.emp:''}*`];
 if(m.cli)L.push('Cliente: '+m.cli);if(m.end)L.push('Obra: '+m.end);L.push('Data: '+fdate(m.data));L.push('');
 S.secs.filter(s=>s.items.some(i=>i.d)).forEach(s=>{
  L.push('*'+s.n+'*');
  s.items.filter(i=>i.d).forEach(i=>{L.push(`- ${i.d}: ${i.q||0} ${i.u} x ${brl(i.v)} = ${brl((i.q||0)*(i.v||0))}`);if(i.det)L.push('  '+i.det)});
  L.push('Subtotal: '+brl(secTot(s)));L.push('');
 });
 if(S.dsc)L.push('Desconto: -'+brl(S.dsc));
 L.push('*TOTAL: '+brl(total())+'*');
 if(m.prazo)L.push('Prazo: '+m.prazo);if(S.pag)L.push('Pagamento: '+S.pag);if(S.obs)L.push('Obs.: '+S.obs);
 L.push('Validade: '+(m.val||15)+' dias');
 return L.join('\n');
}
const say=t=>{$('#msg').textContent=t};
$('#wa').onclick=()=>{let w=null;try{w=window.open('https://wa.me/?text='+encodeURIComponent(texto()),'_blank')}catch(e){}if(w){say('Escolha o contato no WhatsApp para enviar.')}else{$('#cp').click()}};
$('#cp').onclick=async()=>{
 const t=texto();
 try{await navigator.clipboard.writeText(t);say('Texto copiado. Cole na conversa com o cliente.')}
 catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}a.remove();say(ok?'Texto copiado. Cole na conversa com o cliente.':'Não foi possível copiar. Use o botão do WhatsApp.')}
};
$('#pr').onclick=()=>{try{window.print()}catch(e){say('Impressão indisponível aqui. Abra a página no navegador.')}};
render();
</script>
</body>
</html>
